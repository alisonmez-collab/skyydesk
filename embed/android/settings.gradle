// The Android package (.aar) of the embeddable library, and an example application.
// Build with tools/build-android-embed.sh, which first puts the Rust library in place.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "skyydesk-android"
include ":skyydesk"
include ":example"
project(":example").projectDir = file("../examples/android")
