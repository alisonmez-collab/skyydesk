# 1024M idi ve AGP 8 + Kotlin 2.1 + Jetifier bu siniri asiyor: derleme
# "Execution failed for JetifyTransform: ... Java heap space" ile duruyor.
# 4G, GitHub'in ubuntu runner'inda da (16 GB) rahat siniyor.
org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=false
